# O banco NÃO sobe aqui: usamos o Postgres compartilhado do DB-DOCKER (container db-postgres, imagem pgvector),
# com um database próprio "kb". Criar uma vez:
#   docker exec db-postgres psql -U user -d defaultdb -c "CREATE DATABASE kb"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.coolify
    env_file: .env
    environment:
      # host do Postgres compartilhado (rede db_network); usuário e senha vêm do .env
      DATABASE_URL: postgresql://${POSTGRES_USER:?defina POSTGRES_USER no .env}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db-postgres:5432/kb
    ports:
      - "8000:8000"
    networks:
      - db_network
    restart: unless-stopped

networks:
  db_network:
    external: true
