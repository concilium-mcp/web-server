[project]
name = "mcp-rag-api"
version = "0.1.0"
description = "Servidor MCP + API REST com RAG (PostgreSQL + pgvector) e registro de agentes"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "mcp[cli]>=2.2,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
mcp-rag-api = "mcp_rag_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_rag_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "ASYNC240"]  # Query()/Depends() em defaults é o idioma do FastAPI

[tool.mypy]
python_version = "3.12"
# asyncpg e sentence_transformers não têm stubs nem py.typed; sem essa trava o mypy
# falha no import e vira ruído constante no gate de tipos.
[[tool.mypy.overrides]]
module = ["asyncpg.*", "sentence_transformers.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260906",
]
